<div class="app" id="app">
  <!-- ===== Боковая панель: навигация и история ===== -->
  <aside class="sidebar sidebar--empty" id="sidebar" aria-label="Навигация">
    <div class="sidebar__top">
      <div class="sidebar__head">
        <a class="logo" href="#" id="logo">CHINA BRAND</a>
        <button class="icon-button sidebar__close" type="button" id="sidebar-close" aria-label="Закрыть меню">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="sidebar__nav">
        <div class="new-request-wrap">
          <button class="new-request" type="button" id="new-request">
            <span class="new-request__icon"><svg class="icon icon--20"><use href="#i-add"/></svg></span>
            <span class="new-request__label">Новый запрос</span>
          </button>
        </div>

        <nav class="history" aria-label="История запросов">
          <section class="history__group" id="recent" aria-labelledby="recent-title" hidden>
            <h2 class="history__title" id="recent-title">Недавние</h2>
            <ul class="history__list" id="recent-list"></ul>
          </section>

          <section class="history__group" id="favorites" aria-labelledby="favorites-title" hidden>
            <h2 class="history__title" id="favorites-title">
              <svg class="icon icon--20 history__title-icon"><use href="#i-heart"/></svg>
              Мои бренды
            </h2>
            <ul class="history__list" id="favorites-list"></ul>
          </section>
        </nav>
      </div>
    </div>

    <footer class="sidebar__footer">
      <!-- Аватар пользователя (некликабельный, как в макете) -->
      <span class="avatar" aria-hidden="true">
        <svg class="avatar__image" viewBox="0 0 32 32">
          <defs>
            <radialGradient id="avatar-glow" cx=".5" cy=".75" r=".5"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <clipPath id="avatar-clip"><circle cx="16" cy="16" r="16"/></clipPath>
          </defs>
          <g clip-path="url(#avatar-clip)">
            <circle class="avatar__bg" cx="16" cy="16" r="16"/>
            <ellipse cx="16" cy="30.4" rx="12.8" ry="9.6" fill="url(#avatar-glow)"/>
            <circle cx="16" cy="12.8" r="6.4" fill="url(#avatar-glow)"/>
          </g>
        </svg>
      </span>
      <button class="plan-button" type="button" id="plan-button">Сменить план</button>
    </footer>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

  <!-- ===== Основная область: диалог с нейросетью ===== -->
  <main class="chat" id="chat">
    <header class="topbar">
      <button class="icon-button" type="button" id="menu-open" aria-label="Открыть меню" aria-controls="sidebar" aria-expanded="false">
        <svg class="icon"><use href="#i-menu"/></svg>
      </button>
      <span class="logo logo--small">CHINA BRAND</span>
      <button class="icon-button icon-button--soft" type="button" id="topbar-new" aria-label="Новый запрос">
        <svg class="icon icon--20"><use href="#i-add"/></svg>
      </button>
    </header>

    <div class="chat__scroll" id="chat-scroll">
      <div class="chat__column">
        <ol class="dialog" id="dialog" aria-live="polite" aria-label="Диалог с China Brand"></ol>
      </div>
    </div>

    <div class="chat__bottom">
      <div class="chat__column chat__column--bottom">
        <div class="alert-slot" id="alert-slot"></div>
        <div class="apply-bar" id="apply-bar" hidden>
          <button class="button button--primary button--apply" type="button" id="apply-sphere">Применить</button>
        </div>
        <form class="composer" id="composer" autocomplete="off">
          <label class="visually-hidden" for="composer-input">Сообщение</label>
          <input class="composer__input" id="composer-input" type="text" maxlength="60" placeholder="Напишите название бренда, например: BMW">
          <button class="composer__send" type="submit" id="composer-send" aria-label="Отправить">
            <svg class="icon composer__arrow"><use href="#i-arrow-up"/></svg>
            <span class="composer__stop" aria-hidden="true"></span>
          </button>
          <span class="tooltip tooltip--above composer__tooltip" role="tooltip">Остановить генерацию</span>
        </form>
      </div>
    </div>
  </main>
</div>

<!-- ===== Модальное окно подтверждения ===== -->
<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close-modal></div>
  <section class="modal__dialog" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text">
    <h2 class="modal__title" id="modal-title">Хотите удалить?</h2>
    <p class="modal__text" id="modal-text">Адаптация бренда будет удалена из истории. В «Моих брендах» она останется.</p>
    <div class="modal__actions">
      <button class="button button--soft" type="button" data-close-modal>Отменить</button>
      <button class="button button--danger" type="button" id="modal-confirm">Удалить</button>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
